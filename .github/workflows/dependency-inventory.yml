name: Dependency inventory
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required by GitHub's dependency submission API.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Submit bundled libraries and declared Actions refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/dependency-inventory.py --submit
